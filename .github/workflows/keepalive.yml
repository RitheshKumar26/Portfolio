name: Supabase Keepalive
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive
        run: |
          curl -X POST https://keepalive-dashboard.vercel.app/api/health-check \
            -H "Authorization: Bearer ${{ secrets.KEEPALIVE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"project_id": "11a58b59-4fc0-4a3f-81be-cb4bc2a3e1c7", "triggered_by": "github_actions"}'
